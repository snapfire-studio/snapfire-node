# Added by setup.sh when an NVIDIA GPU and the NVIDIA Container Toolkit are found.
services:
  comfyui:
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
  ollama:
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
